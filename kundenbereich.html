<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>LieblingsDeals – Kundenbereich</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    header {
      background: #ff6a00;
      color: #fff;
      padding: 22px 20px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px #0001;
    }

    h2 {
      margin-bottom: 15px;
    }

    h3 {
      margin-bottom: 12px;
    }

    .account-info {
      color: #666;
      line-height: 1.7;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .primary {
      background: #ff6a00;
      color: #fff;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .danger {
      background: #ffe5e5;
      color: #a00000;
    }

    .edit {
      background: #fff3e8;
      color: #d95700;
    }

    .category-list,
    .product-list {
      display: grid;
      gap: 12px;
      margin-top: 15px;
    }

    .item {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 15px;
      background: #fafafa;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    .item-title {
      font-weight: 700;
      font-size: 17px;
    }

    .muted {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
      line-height: 1.5;
    }

    .product-image {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      margin-bottom: 10px;
      border: 1px solid #eee;
      background: #fff;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .empty,
    .loading {
      padding: 20px;
      text-align: center;
      color: #777;
      background: #fafafa;
      border-radius: 12px;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    .success {
      background: #e8f7e8;
      color: #176b17;
    }

    .error {
      background: #ffe8e8;
      color: #a00000;
    }

    .form-box {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #eee;
      border-radius: 12px;
      background: #fafafa;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .form-actions button {
      flex: 1;
      min-width: 140px;
    }

    .price {
      font-weight: 700;
      margin-top: 8px;
    }

    .affiliate-link {
      display: inline-block;
      margin-top: 8px;
      color: #ff6a00;
      font-weight: 700;
      text-decoration: none;
      word-break: break-all;
    }

    .affiliate-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .container {
        padding: 0 15px;
      }

      .item-header {
        flex-direction: column;
      }

      .item-actions {
        width: 100%;
        justify-content: stretch;
      }

      .item-actions button {
        flex: 1;
      }

      .top-actions {
        align-items: stretch;
      }

      .top-actions > button {
        width: 100%;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <div class="logo">⭐ LieblingsDeals</div>
  <div class="subtitle">Dein persönlicher Kundenbereich</div>
</header>

<div class="container">

  <div id="message" class="message"></div>

  <!-- KONTO -->

  <div class="card">

    <div class="top-actions">

      <div>
        <h2>👤 Mein Konto</h2>

        <div id="account-info" class="account-info">
          Konto wird geladen...
        </div>
      </div>

      <button id="logout-button" class="danger">
        🚪 Abmelden
      </button>

    </div>

  </div>


  <!-- KATEGORIEN -->

  <div class="card">

    <div class="top-actions">

      <h2>📂 Meine Kategorien</h2>

      <button id="add-category-button" class="primary">
        ➕ Kategorie
      </button>

    </div>

    <div id="categories" class="category-list">
      <div class="loading">
        Kategorien werden geladen...
      </div>
    </div>

  </div>


  <!-- PRODUKTE -->

  <div class="card">

    <div class="top-actions">

      <h2>🛍️ Meine Produkte</h2>

      <button id="add-product-button" class="primary">
        ➕ Produkt
      </button>

    </div>

    <div id="products" class="product-list">
      <div class="loading">
        Produkte werden geladen...
      </div>
    </div>


    <!-- PRODUKT-FORMULAR -->

    <div id="product-form" class="form-box">

      <h3 id="product-form-title">
        Produkt erstellen
      </h3>

      <div class="form-group">

        <label for="product-title-input">
          Produktname
        </label>

        <input
          type="text"
          id="product-title-input"
          placeholder="Produktname"
          maxlength="200"
        >

      </div>


      <div class="form-group">

        <label for="product-image-input">
          Produktbild
        </label>

        <input
          type="file"
          id="product-image-input"
          accept="image/jpeg,image/png,image/webp"
        >

        <div
          id="current-image-info"
          class="muted"
          style="display:none;"
        >
          Aktuelles Bild bleibt erhalten, wenn kein neues Bild ausgewählt wird.
        </div>

      </div>


      <div class="form-group">

        <label for="product-description-input">
          Beschreibung
        </label>

        <textarea
          id="product-description-input"
          placeholder="Beschreibung des Produkts"
          maxlength="5000"
        ></textarea>

      </div>


      <div class="form-group">

        <label for="product-price-input">
          Preis
        </label>

        <input
          type="text"
          id="product-price-input"
          placeholder="z. B. 19,99"
        >

      </div>


      <div class="form-group">

        <label for="product-affiliate-input">
          Affiliate-URL
        </label>

        <input
          type="url"
          id="product-affiliate-input"
          placeholder="https://..."
        >

      </div>


      <div class="form-group">

        <label for="product-category-input">
          Kategorie
        </label>

        <select id="product-category-input">
          <option value="">
            Kategorie auswählen
          </option>
        </select>

      </div>


      <div class="form-actions">

        <button
          type="button"
          id="save-product-button"
          class="primary"
        >
          Produkt speichern
        </button>

        <button
          type="button"
          id="cancel-product-button"
          class="secondary"
        >
          Abbrechen
        </button>

      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://cklnfznlzyushvlybzad.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_FQB7IjlWRpGhNf4r1pV5Vg_JHQgxkGg";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   ELEMENTE
   ========================================================= */

const message =
  document.getElementById("message");

const accountInfo =
  document.getElementById("account-info");

const categoriesContainer =
  document.getElementById("categories");

const productsContainer =
  document.getElementById("products");

const productForm =
  document.getElementById("product-form");

const productFormTitle =
  document.getElementById("product-form-title");

const productTitleInput =
  document.getElementById("product-title-input");

const productImageInput =
  document.getElementById("product-image-input");

const productDescriptionInput =
  document.getElementById("product-description-input");

const productPriceInput =
  document.getElementById("product-price-input");

const productAffiliateInput =
  document.getElementById("product-affiliate-input");

const productCategoryInput =
  document.getElementById("product-category-input");

const currentImageInfo =
  document.getElementById("current-image-info");

const saveProductButton =
  document.getElementById("save-product-button");

const cancelProductButton =
  document.getElementById("cancel-product-button");

const addProductButton =
  document.getElementById("add-product-button");

const addCategoryButton =
  document.getElementById("add-category-button");

const logoutButton =
  document.getElementById("logout-button");


let currentUser = null;
let editingProductId = null;
let editingProductImageUrl = null;


/* =========================================================
   NACHRICHTEN
   ========================================================= */

function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

  message.style.display = "block";

}


function clearMessage() {

  message.textContent = "";

  message.className = "message";

  message.style.display = "none";

}


/* =========================================================
   HTML SICHER DARSTELLEN
   ========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================================
   URL VALIDIEREN
   ========================================================= */

function isValidHttpUrl(value) {

  try {

    const url =
      new URL(value);

    return (
      url.protocol === "http:" ||
      url.protocol === "https:"
    );

  } catch {

    return false;

  }

}


/* =========================================================
   PREIS
   ========================================================= */

function parsePrice(value) {

  if (!value || !value.trim()) {
    return null;
  }

  const normalized =
    value
      .trim()
      .replace(/\./g, "")
      .replace(",", ".");

  const number =
    Number(normalized);

  return Number.isFinite(number)
    ? number
    : null;

}


/* =========================================================
   DATEIPFAD AUS PUBLIC URL
   ========================================================= */

function getStoragePathFromUrl(url) {

  if (!url) {
    return null;
  }

  const marker =
    "/storage/v1/object/public/product-images/";

  const index =
    url.indexOf(marker);

  if (index === -1) {
    return null;
  }

  return decodeURIComponent(
    url.substring(
      index + marker.length
    )
  );

}


/* =========================================================
   SESSION
   ========================================================= */

async function checkSession() {

  clearMessage();

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();


  if (error) {

    console.error(
      "Session-Fehler:",
      error
    );

    showMessage(
      "Die Anmeldung konnte nicht überprüft werden.",
      "error"
    );

    return;

  }


  if (!data.session) {

    window.location.href =
      "login.html";

    return;

  }


  currentUser =
    data.session.user;


  accountInfo.innerHTML = `
    <strong>E-Mail:</strong>
    ${escapeHtml(currentUser.email || "")}
    <br>
    <strong>User-ID:</strong>
    ${escapeHtml(currentUser.id)}
  `;


  await Promise.all([
    loadCategories(),
    loadProducts()
  ]);

}


/* =========================================================
   KATEGORIEN LADEN
   ========================================================= */

async function loadCategories() {

  categoriesContainer.innerHTML =
    '<div class="loading">Kategorien werden geladen...</div>';


  const {
    data,
    error
  } =
    await supabaseClient
      .from("customer_categories")
      .select("*")
      .eq(
        "customer_id",
        currentUser.id
      )
      .order("created_at", {
        ascending: true
      });


  if (error) {

    console.error(
      "Kategorie-Ladefehler:",
      error
    );

    categoriesContainer.innerHTML =
      '<div class="empty">Kategorien konnten momentan nicht geladen werden.</div>';

    return;

  }


  productCategoryInput.innerHTML =
    '<option value="">Kategorie auswählen</option>';


  if (!data || data.length === 0) {

    categoriesContainer.innerHTML =
      '<div class="empty">Du hast noch keine eigenen Kategorien.</div>';

    return;

  }


  categoriesContainer.innerHTML = "";


  data.forEach(category => {

    const item =
      document.createElement("div");

    item.className =
      "item";


    item.innerHTML = `

      <div class="item-header">

        <div>

          <div class="item-title">
            ${escapeHtml(category.icon || "📂")}
            ${escapeHtml(category.name)}
          </div>

          <div class="muted">
            Slug: ${escapeHtml(category.slug || "")}
          </div>

        </div>

        <div class="item-actions">

          <button
            class="danger"
            type="button"
          >
            Löschen
          </button>

        </div>

      </div>

    `;


    const deleteButton =
      item.querySelector(".danger");


    deleteButton.addEventListener(
      "click",
      () => deleteCategory(category.id)
    );


    categoriesContainer.appendChild(item);


    const option =
      document.createElement("option");

    option.value =
      category.id;

    option.textContent =
      `${category.icon || "📂"} ${category.name}`;

    productCategoryInput.appendChild(option);

  });

}


/* =========================================================
   PRODUKTE LADEN
   ========================================================= */

async function loadProducts() {

  productsContainer.innerHTML =
    '<div class="loading">Produkte werden geladen...</div>';


  const {
    data,
    error
  } =
    await supabaseClient
      .from("customer_products")
      .select("*")
      .eq(
        "customer_id",
        currentUser.id
      )
      .order("sort_order", {
        ascending: true
      })
      .order("created_at", {
        ascending: true
      });


  if (error) {

    console.error(
      "Produkt-Ladefehler:",
      error
    );

    productsContainer.innerHTML =
      '<div class="empty">Produkte konnten momentan nicht geladen werden.</div>';

    return;

  }


  if (!data || data.length === 0) {

    productsContainer.innerHTML =
      '<div class="empty">Du hast noch keine eigenen Produkte.</div>';

    return;

  }


  productsContainer.innerHTML = "";


  data.forEach(product => {

    const item =
      document.createElement("div");

    item.className =
      "item";


    const imageHtml =
      product.image_url
        ? `
          <img
            class="product-image"
            src="${escapeHtml(product.image_url)}"
            alt="${escapeHtml(product.title)}"
          >
        `
        : "";


    const priceHtml =
      product.price !== null &&
      product.price !== undefined
        ? `
          <div class="price">
            ${escapeHtml(
              Number(product.price).toFixed(2).replace(".", ",")
            )} €
          </div>
        `
        : "";


    const affiliateHtml =
      product.affiliate_url
        ? `
          <a
            class="affiliate-link"
            href="${escapeHtml(product.affiliate_url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            🔗 Angebot öffnen
          </a>
        `
        : "";


    item.innerHTML = `

      <div class="item-header">

        <div style="flex:1;">

          ${imageHtml}

          <div class="item-title">
            ${escapeHtml(product.title)}
          </div>

          ${
            product.description
              ? `
                <div class="muted">
                  ${escapeHtml(product.description)}
                </div>
              `
              : ""
          }

          ${priceHtml}

          ${affiliateHtml}

        </div>


        <div class="item-actions">

          <button
            class="edit"
            type="button"
          >
            ✏️ Bearbeiten
          </button>

          <button
            class="danger"
            type="button"
          >
            🗑️ Löschen
          </button>

        </div>

      </div>

    `;


    const editButton =
      item.querySelector(".edit");

    const deleteButton =
      item.querySelector(".danger");


    editButton.addEventListener(
      "click",
      () => editProduct(product.id)
    );


    deleteButton.addEventListener(
      "click",
      () => deleteProduct(product.id)
    );


    productsContainer.appendChild(item);

  });

}


/* =========================================================
   KATEGORIE ERSTELLEN
   ========================================================= */

addCategoryButton.addEventListener(
  "click",
  async () => {

    clearMessage();


    if (!currentUser) {
      return;
    }


    const name =
      prompt(
        "Name der neuen Kategorie:"
      );


    if (name === null) {
      return;
    }


    const cleanName =
      name.trim();


    if (!cleanName) {

      showMessage(
        "Bitte einen Kategorienamen eingeben.",
        "error"
      );

      return;

    }


    const slug =
      cleanName
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");


    if (!slug) {

      showMessage(
        "Für diese Kategorie konnte kein gültiger Slug erstellt werden.",
        "error"
      );

      return;

    }


    addCategoryButton.disabled =
      true;


    try {

      const {
        error
      } =
        await supabaseClient
          .from("customer_categories")
          .insert({
            customer_id:
              currentUser.id,

            name:
              cleanName,

            slug:
              slug,

            icon:
              "📂",

            active:
              true
          });


      if (error) {
        throw error;
      }


      showMessage(
        "Kategorie wurde erstellt.",
        "success"
      );


      await loadCategories();

    } catch (error) {

      console.error(
        "Kategorie-Erstellfehler:",
        error
      );

      showMessage(
        "Kategorie konnte nicht erstellt werden.",
        "error"
      );

    } finally {

      addCategoryButton.disabled =
        false;

    }

  }
);


/* =========================================================
   KATEGORIE LÖSCHEN
   ========================================================= */

async function deleteCategory(categoryId) {

  if (!currentUser) {
    return;
  }


  const confirmed =
    confirm(
      "Möchtest du diese Kategorie wirklich löschen?"
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("customer_categories")
      .delete()
      .eq(
        "id",
        categoryId
      )
      .eq(
        "customer_id",
        currentUser.id
      );


  if (error) {

    console.error(
      "Kategorie-Löschfehler:",
      error
    );

    showMessage(
      "Kategorie konnte nicht gelöscht werden.",
      "error"
    );

    return;

  }


  showMessage(
    "Kategorie wurde gelöscht.",
    "success"
  );


  await Promise.all([
    loadCategories(),
    loadProducts()
  ]);

}


/* =========================================================
   PRODUKT-FORMULAR ÖFFNEN
   ========================================================= */

async function openProductForm(product = null) {

  clearMessage();


  editingProductId =
    product
      ? product.id
      : null;


  editingProductImageUrl =
    product
      ? product.image_url
      : null;


  productFormTitle.textContent =
    product
      ? "Produkt bearbeiten"
      : "Produkt erstellen";


  productTitleInput.value =
    product?.title || "";


  productDescriptionInput.value =
    product?.description || "";


  productPriceInput.value =
    product?.price !== null &&
    product?.price !== undefined
      ? String(product.price).replace(".", ",")
      : "";


  productAffiliateInput.value =
    product?.affiliate_url || "";


  productImageInput.value =
    "";


  currentImageInfo.style.display =
    product?.image_url
      ? "block"
      : "none";


  await loadCategoryOptions(
    product?.category_id || ""
  );


  productForm.style.display =
    "block";


  productForm.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/* =========================================================
   KATEGORIE-OPTIONEN
   ========================================================= */

async function loadCategoryOptions(
  selectedCategoryId = ""
) {

  productCategoryInput.innerHTML =
    '<option value="">Kategorien werden geladen...</option>';


  const {
    data,
    error
  } =
    await supabaseClient
      .from("customer_categories")
      .select("id,name,icon")
      .eq(
        "customer_id",
        currentUser.id
      )
      .order("created_at", {
        ascending: true
      });


  if (error) {

    console.error(
      "Kategorie-Optionen Fehler:",
      error
    );

    productCategoryInput.innerHTML =
      '<option value="">Kategorien konnten nicht geladen werden</option>';

    return false;

  }


  if (!data || data.length === 0) {

    productCategoryInput.innerHTML =
      '<option value="">Keine Kategorien vorhanden</option>';

    return false;

  }


  productCategoryInput.innerHTML =
    '<option value="">Kategorie auswählen</option>';


  data.forEach(category => {

    const option =
      document.createElement("option");

    option.value =
      category.id;

    option.textContent =
      `${category.icon || "📂"} ${category.name}`;

    if (
      String(category.id) ===
      String(selectedCategoryId)
    ) {

      option.selected =
        true;

    }


    productCategoryInput.appendChild(option);

  });


  return true;

}


/* =========================================================
   PRODUKT HINZUFÜGEN
   ========================================================= */

addProductButton.addEventListener(
  "click",
  async () => {

    await openProductForm();

  }
);


/* =========================================================
   PRODUKT-FORMULAR ABBRECHEN
   ========================================================= */

cancelProductButton.addEventListener(
  "click",
  () => {

    productForm.style.display =
      "none";

    editingProductId =
      null;

    editingProductImageUrl =
      null;

    productImageInput.value =
      "";

    clearMessage();

  }
);


/* =========================================================
   PRODUKT SPEICHERN
   ========================================================= */

saveProductButton.addEventListener(
  "click",
  async () => {

    clearMessage();


    if (!currentUser) {

      showMessage(
        "Bitte zuerst anmelden.",
        "error"
      );

      return;

    }


    const title =
      productTitleInput.value.trim();

    const description =
      productDescriptionInput.value.trim();

    const priceText =
      productPriceInput.value.trim();

    const affiliateUrl =
      productAffiliateInput.value.trim();

    const categoryId =
      productCategoryInput.value;

    const imageFile =
      productImageInput.files[0];


    /* TITEL */

    if (!title) {

      showMessage(
        "Bitte einen Produktnamen eingeben.",
        "error"
      );

      return;

    }


    /* AFFILIATE URL */

    if (!affiliateUrl) {

      showMessage(
        "Bitte eine Affiliate-URL eingeben.",
        "error"
      );

      return;

    }


    if (!isValidHttpUrl(affiliateUrl)) {

      showMessage(
        "Bitte eine gültige http- oder https-Affiliate-URL eingeben.",
        "error"
      );

      return;

    }


    /* KATEGORIE */

    if (!categoryId) {

      showMessage(
        "Bitte eine Kategorie auswählen.",
        "error"
      );

      return;

    }


    /* PREIS */

    let price = null;

    if (priceText) {

      price =
        parsePrice(priceText);


      if (
        price === null ||
        price < 0
      ) {

        showMessage(
          "Bitte einen gültigen Preis eingeben.",
          "error"
        );

        return;

      }

    }


    /* BEIM NEUEN PRODUKT BILD ERFORDERN */

    if (
      !editingProductId &&
      !imageFile
    ) {

      showMessage(
        "Bitte ein Produktbild auswählen.",
        "error"
      );

      return;

    }


    saveProductButton.disabled =
      true;


    try {

      let imageUrl =
        editingProductImageUrl || null;


      /* =============================================
         NEUES BILD HOCHLADEN
         ============================================= */

      if (imageFile) {

        const allowedTypes = [
          "image/jpeg",
          "image/png",
          "image/webp"
        ];


        if (
          !allowedTypes.includes(
            imageFile.type
          )
        ) {

          throw new Error(
            "Nur JPG-, PNG- und WebP-Bilder sind erlaubt."
          );

        }


        /* 5 MB */

        if (
          imageFile.size >
          5 * 1024 * 1024
        ) {

          throw new Error(
            "Das Produktbild darf maximal 5 MB groß sein."
          );

        }


        const extension =
          imageFile.name
            .split(".")
            .pop()
            .toLowerCase();


        const filePath =
          currentUser.id +
          "/" +
          crypto.randomUUID() +
          "." +
          extension;


        const {
          error: uploadError
        } =
          await supabaseClient
            .storage
            .from("product-images")
            .upload(
              filePath,
              imageFile,
              {
                contentType:
                  imageFile.type,

                upsert:
                  false
              }
            );


        if (uploadError) {

          console.error(
            "Bild-Upload:",
            uploadError
          );

          throw new Error(
            "Produktbild konnte nicht hochgeladen werden."
          );

        }


        const {
          data: publicUrlData
        } =
          supabaseClient
            .storage
            .from("product-images")
            .getPublicUrl(
              filePath
            );


        imageUrl =
          publicUrlData.publicUrl;


        /* ALTES BILD LÖSCHEN */

        if (
          editingProductImageUrl
        ) {

          const oldPath =
            getStoragePathFromUrl(
              editingProductImageUrl
            );


          if (oldPath) {

            const {
              error: deleteImageError
            } =
              await supabaseClient
                .storage
                .from("product-images")
                .remove([
                  oldPath
                ]);


            if (deleteImageError) {

              console.warn(
                "Altes Bild konnte nicht gelöscht werden:",
                deleteImageError
              );

            }

          }

        }

      }


      /* =============================================
         DATEN
         ============================================= */

      const productData = {

        customer_id:
          currentUser.id,

        category_id:
          categoryId,

        title:
          title,

        description:
          description || null,

        price:
          price,

        image_url:
          imageUrl,

        affiliate_url:
          affiliateUrl,

        active:
          true

      };


      /* =============================================
         NEU
         ============================================= */

      if (!editingProductId) {

        productData.sort_order =
          0;


        const {
          error
        } =
          await supabaseClient
            .from("customer_products")
            .insert(
              productData
            );


        if (error) {

          console.error(
            "Produkt INSERT:",
            error
          );

          throw new Error(
            "Produkt konnte nicht gespeichert werden."
          );

        }


        showMessage(
          "Produkt wurde erfolgreich erstellt.",
          "success"
        );

      }


      /* =============================================
         BEARBEITEN
         ============================================= */

      else {

        delete productData.customer_id;


        const {
          error
        } =
          await supabaseClient
            .from("customer_products")
            .update(
              productData
            )
            .eq(
              "id",
              editingProductId
            )
            .eq(
              "customer_id",
              currentUser.id
            );


        if (error) {

          console.error(
            "Produkt UPDATE:",
            error
          );

          throw new Error(
            "Produkt konnte nicht aktualisiert werden."
          );

        }


        showMessage(
          "Produkt wurde erfolgreich aktualisiert.",
          "success"
        );

      }


      productForm.style.display =
        "none";


      editingProductId =
        null;

      editingProductImageUrl =
        null;


      productImageInput.value =
        "";


      await loadProducts();


    } catch (error) {

      console.error(
        "Produkt speichern:",
        error
      );


      showMessage(
        error.message ||
        "Produkt konnte nicht gespeichert werden.",
        "error"
      );

    } finally {

      saveProductButton.disabled =
        false;

    }

  }
);


/* =========================================================
   PRODUKT BEARBEITEN
   ========================================================= */

async function editProduct(productId) {

  clearMessage();


  const {
    data: product,
    error
  } =
    await supabaseClient
      .from("customer_products")
      .select("*")
      .eq(
        "id",
        productId
      )
      .eq(
        "customer_id",
        currentUser.id
      )
      .single();


  if (error || !product) {

    console.error(
      "Produkt laden:",
      error
    );

    showMessage(
      "Produkt konnte nicht geladen werden.",
      "error"
    );

    return;

  }


  await openProductForm(
    product
  );

}


/* =========================================================
   PRODUKT LÖSCHEN
   ========================================================= */

async function deleteProduct(productId) {

  if (!currentUser) {
    return;
  }


  const confirmed =
    confirm(
      "Möchtest du dieses Produkt wirklich löschen?"
    );


  if (!confirmed) {
    return;
  }


  /* PRODUKT ZUERST LADEN */

  const {
    data: product,
    error: loadError
  } =
    await supabaseClient
      .from("customer_products")
      .select("id,image_url")
      .eq(
        "id",
        productId
      )
      .eq(
        "customer_id",
        currentUser.id
      )
      .single();


  if (loadError || !product) {

    console.error(
      "Produkt vor Löschen:",
      loadError
    );

    showMessage(
      "Produkt konnte nicht gefunden werden.",
      "error"
    );

    return;

  }


  /* PRODUKT LÖSCHEN */

  const {
    error
  } =
    await supabaseClient
      .from("customer_products")
      .delete()
      .eq(
        "id",
        productId
      )
      .eq(
        "customer_id",
        currentUser.id
      );


  if (error) {

    console.error(
      "Produkt-Löschfehler:",
      error
    );

    showMessage(
      "Produkt konnte nicht gelöscht werden.",
      "error"
    );

    return;

  }


  /* BILD LÖSCHEN */

  if (product.image_url) {

    const imagePath =
      getStoragePathFromUrl(
        product.image_url
      );


    if (imagePath) {

      const {
        error: imageDeleteError
      } =
        await supabaseClient
          .storage
          .from("product-images")
          .remove([
            imagePath
          ]);


      if (imageDeleteError) {

        console.warn(
          "Produktbild konnte nicht gelöscht werden:",
          imageDeleteError
        );

      }

    }

  }


  showMessage(
    "Produkt wurde gelöscht.",
    "success"
  );


  await loadProducts();

}


/* =========================================================
   ABMELDEN
   ========================================================= */

logoutButton.addEventListener(
  "click",
  async () => {

    logoutButton.disabled =
      true;


    const {
      error
    } =
      await supabaseClient.auth.signOut();


    if (error) {

      console.error(
        "Logout:",
        error
      );

      logoutButton.disabled =
        false;

      showMessage(
        "Abmelden fehlgeschlagen.",
        "error"
      );

      return;

    }


    window.location.href =
      "login.html";

  }
);


/* =========================================================
   AUTH-ÄNDERUNGEN
   ========================================================= */

supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    if (
      event === "SIGNED_OUT"
    ) {

      window.location.href =
        "login.html";

    }

  }
);


/* =========================================================
   START
   ========================================================= */

checkSession();

</script>
