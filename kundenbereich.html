<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>LieblingsDeals – Kundenbereich</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
      padding-bottom: 40px;
    }

    header {
      background: #ff6a00;
      color: #fff;
      padding: 22px 20px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px #0001;
    }

    h2 {
      margin-bottom: 15px;
    }

    h3 {
      margin-bottom: 8px;
    }

    .account-info {
      color: #666;
      line-height: 1.6;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #ff6a00;
      color: #fff;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .danger {
      background: #ffe5e5;
      color: #a00000;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .category-list,
    .product-list {
      display: grid;
      gap: 12px;
    }

    .item {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 15px;
      background: #fafafa;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .item-title {
      font-weight: 700;
      font-size: 17px;
    }

    .muted {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .empty {
      padding: 20px;
      text-align: center;
      color: #777;
      background: #fafafa;
      border-radius: 12px;
    }

    .loading {
      color: #777;
      padding: 10px 0;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    .success {
      background: #e8f7e8;
      color: #176b17;
    }

    .error {
      background: #ffe8e8;
      color: #a00000;
    }

    .logout {
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 0 15px;
      }

      .top-actions {
        align-items: stretch;
      }

      .top-actions button {
        width: 100%;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <div class="logo">⭐ LieblingsDeals</div>
  <div class="subtitle">Dein persönlicher Kundenbereich</div>
</header>


<div class="container">

  <div id="message" class="message"></div>


  <!-- =====================================================
       KONTO
       ===================================================== -->

  <div class="card">

    <div class="top-actions">

      <div>
        <h2>👤 Mein Konto</h2>

        <div
          id="account-info"
          class="account-info"
        >
          Konto wird geladen...
        </div>
      </div>

      <button
        id="logout-button"
        class="danger"
      >
        🚪 Abmelden
      </button>

    </div>

  </div>


  <!-- =====================================================
       KATEGORIEN
       ===================================================== -->

  <div class="card">

    <div class="top-actions">

      <h2>📂 Meine Kategorien</h2>

      <button
        id="add-category-button"
        class="primary"
      >
        ➕ Kategorie
      </button>

    </div>

    <div
      id="categories"
      class="category-list"
    >
      <div class="loading">
        Kategorien werden geladen...
      </div>
    </div>

  </div>


  <!-- =====================================================
       PRODUKTE
       ===================================================== -->

  <div class="card">

    <div class="top-actions">

      <h2>🛍️ Meine Produkte</h2>

      <button
        id="add-product-button"
        class="primary"
      >
        ➕ Produkt
      </button>

    </div>

    <div
      id="products"
      class="product-list"
    >
      <div class="loading">
        Produkte werden geladen...
      </div>
    </div>
<div
  id="product-form"
  style="display: none; margin-top: 20px;"
>

  <h3>Produkt erstellen</h3>

  <div style="margin-bottom: 12px;">
    <label for="product-title-input">
      Produktname:
    </label>

    <input
      type="text"
      id="product-title-input"
      placeholder="Produktname"
    >
  </div>


  <div style="margin-bottom: 12px;">
    <label for="product-image-input">
      Produktbild:
    </label>

    <input
      type="file"
      id="product-image-input"
      accept="image/jpeg,image/png,image/webp"
    >
  </div>


  <div style="margin-bottom: 12px;">
    <label for="product-description-input">
      Beschreibung:
    </label>

    <textarea
      id="product-description-input"
      placeholder="Beschreibung des Produkts"
    ></textarea>
  </div>


  <div style="margin-bottom: 12px;">
    <label for="product-price-input">
      Preis:
    </label>

    <input
      type="text"
      id="product-price-input"
      placeholder="z. B. 19,99"
    >
  </div>


  <div style="margin-bottom: 12px;">
    <label for="product-affiliate-input">
      Affiliate-URL:
    </label>

    <input
      type="url"
      id="product-affiliate-input"
      placeholder="https://..."
    >
  </div>


  <div style="margin-bottom: 12px;">
    <label for="product-category-input">
      Kategorie:
    </label>

    <select id="product-category-input">
      <option value="">
        Kategorie auswählen
      </option>
    </select>
  </div>


  <div style="display: flex; gap: 10px;">

    <button
      type="button"
      id="save-product-button"
      class="primary"
    >
      Produkt speichern
    </button>

    <button
      type="button"
      id="cancel-product-button"
    >
      Abbrechen
    </button>

  </div>

</div>
  </div>

</div>


<script>

  /* =========================================================
     SUPABASE
     ========================================================= */

  const SUPABASE_URL =
    "https://cklnfznlzyushvlybzad.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_FQB7IjlWRpGhNf4r1pV5Vg_JHQgxkGg";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     ELEMENTE
     ========================================================= */

  const message =
    document.getElementById("message");

  const accountInfo =
    document.getElementById("account-info");

  const categoriesContainer =
    document.getElementById("categories");

  const productsContainer =
    document.getElementById("products");
const productForm =
  document.getElementById("product-form");

const productTitleInput =
  document.getElementById("product-title-input");

const productImageInput =
  document.getElementById("product-image-input");

const productDescriptionInput =
  document.getElementById("product-description-input");

const productPriceInput =
  document.getElementById("product-price-input");

const productAffiliateInput =
  document.getElementById("product-affiliate-input");

const productCategoryInput =
  document.getElementById("product-category-input");

const saveProductButton =
  document.getElementById("save-product-button");

const cancelProductButton =
  document.getElementById("cancel-product-button");
console.log("FORMULAR ELEMENTE GELADEN");
  let currentUser = null;
  
saveProductButton.addEventListener(
  "click",
  async () => {

    const title =
      productTitleInput.value.trim();

    const description =
      productDescriptionInput.value.trim();

    const priceText =
      productPriceInput.value.trim();

    const affiliateUrl =
      productAffiliateInput.value.trim();

    const categoryId =
      productCategoryInput.value;

    const imageFile =
      productImageInput.files[0];


    if (!title) {

      showMessage(
        "Bitte einen Produktnamen eingeben.",
        "error"
      );

      return;

    }


    if (!affiliateUrl) {

      showMessage(
        "Eine Affiliate-URL ist erforderlich.",
        "error"
      );

      return;

    }


    if (!categoryId) {

      showMessage(
        "Bitte eine Kategorie auswählen.",
        "error"
      );

      return;

    }


    if (!imageFile) {

      showMessage(
        "Bitte ein Produktbild auswählen.",
        "error"
      );

      return;

    }


    let imageUrl = null;


    const fileExtension =
      imageFile.name
        .split(".")
        .pop()
        .toLowerCase();


    const filePath =
      currentUser.id +
      "/" +
      crypto.randomUUID() +
      "." +
      fileExtension;


    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("product-images")
        .upload(
          filePath,
          imageFile,
          {
            contentType:
              imageFile.type,
            upsert: false
          }
        );


    if (uploadError) {

      console.error(
        "Bild Upload Fehler:",
        uploadError
      );

      showMessage(
        "Produktbild konnte nicht hochgeladen werden.",
        "error"
      );

      return;

    }


    const {
      data: publicUrlData
    } =
      supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(filePath);


    imageUrl =
      publicUrlData.publicUrl;


    const price =
      priceText
        ? Number(
            priceText.replace(",", ".")
          )
        : null;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("customer_products")
        .insert({
          customer_id:
            currentUser.id,

          category_id:
            categoryId,

          title:
            title,

          description:
            description
              ? description
              : null,

          price:
            price,

          image_url:
            imageUrl,

          affiliate_url:
            affiliateUrl,

          sort_order:
            0,

          active:
            true
        })
        .select()
        .single();

console.log("DATEN NACH INSERT:", data);
console.log("FEHLER NACH INSERT:", error);
    if (error) {

      console.error(
        "Produkt INSERT Fehler:",
        error
      );

      showMessage(
        "Produkt konnte nicht erstellt werden: " +
        error.message,
        "error"
      );

      return;

    }


    console.log(
      "Produkt erfolgreich erstellt:",
      data
    );

productForm.reset();

productForm.style.display =
  "none";

showMessage(
  "Produkt wurde erstellt.",
  "success"
);

await loadProducts();


    

  }
);

  /* =========================================================
     NACHRICHT
     ========================================================= */

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";

  }


  function clearMessage() {

    message.textContent = "";

    message.style.display = "none";

  }


  /* =========================================================
     SESSION PRÜFEN
     ========================================================= */

  async function checkSession() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(error);

      showMessage(
        "Die Sitzung konnte nicht geladen werden.",
        "error"
      );

      return;

    }


    if (!data.session) {

      window.location.href =
        "login.html";

      return;

    }


    currentUser =
      data.session.user;


    accountInfo.innerHTML = `
      <strong>E-Mail:</strong>
      ${escapeHtml(currentUser.email || "")}
      <br>
      <strong>User-ID:</strong>
      ${escapeHtml(currentUser.id)}
    `;


    await loadCategories();

    await loadProducts();

  }


  /* =========================================================
     HTML SICHER DARSTELLEN
     ========================================================= */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =========================================================
     KATEGORIEN LADEN
     ========================================================= */

  async function loadCategories() {

    categoriesContainer.innerHTML =
      '<div class="loading">Kategorien werden geladen...</div>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from("customer_categories")
        .select("*")
        .order("created_at", {
          ascending: true
        });


    if (error) {

      console.error(error);

      categoriesContainer.innerHTML =
        '<div class="empty">Kategorien konnten nicht geladen werden.</div>';

      return;

    }


    if (!data.length) {

      categoriesContainer.innerHTML =
        '<div class="empty">Du hast noch keine eigenen Kategorien.</div>';

      return;

    }


    categoriesContainer.innerHTML = "";
productCategoryInput.innerHTML =
  '<option value="">Kategorie auswählen</option>';

    data.forEach(category => {

      const item =
        document.createElement("div");

      item.className = "item";

      item.innerHTML = `

        <div class="item-header">

          <div>

            <div class="item-title">
              ${escapeHtml(category.icon || "")}
              ${escapeHtml(category.name)}
            </div>

            <div class="muted">
              Slug:
              ${escapeHtml(category.slug)}
            </div>

          </div>

          <button
            class="danger"
            data-id="${escapeHtml(category.id)}"
          >
            Löschen
          </button>

        </div>

      `;


      item
        .querySelector("button")
        .addEventListener(
          "click",
          () => deleteCategory(category.id)
        );


      categoriesContainer.appendChild(item);

    });

  }


  /* =========================================================
     PRODUKTE LADEN
     ========================================================= */

  async function loadProducts() {

    productsContainer.innerHTML =
      '<div class="loading">Produkte werden geladen...</div>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from("customer_products")
        .select("*")
        .order("sort_order", {
          ascending: true
        });


    if (error) {

      console.error(error);

      productsContainer.innerHTML =
        '<div class="empty">Produkte konnten nicht geladen werden.</div>';

      return;

    }


    if (!data.length) {

      productsContainer.innerHTML =
        '<div class="empty">Du hast noch keine eigenen Produkte.</div>';

      return;

    }


    productsContainer.innerHTML = "";


    data.forEach(product => {

      const item =
        document.createElement("div");

      item.className = "item";

      item.innerHTML = `

        <div class="item-header">

  <div>

    ${
      product.image_url
        ? `
          <img
            src="${escapeHtml(product.image_url)}"
            alt="${escapeHtml(product.title)}"
            style="
              width: 100px;
              height: 100px;
              object-fit: cover;
              border-radius: 8px;
              margin-bottom: 10px;
            "
          >
        `
        : ""
    }

    <div class="item-title">
      ${escapeHtml(product.title)}
    </div>

            <div class="muted">
              ${escapeHtml(product.description || "")}
            </div>

            ${
              product.price !== null
                ? `
                  <div class="muted">
                    Preis:
                    ${escapeHtml(product.price)} €
                  </div>
                `
                : ""
            }

          </div>

          <button
            class="danger"
            data-id="${escapeHtml(product.id)}"
          >
            Löschen
          </button>
<button
  class="edit"
  data-id="${escapeHtml(product.id)}"
>
  Bearbeiten
</button>
        </div>

      `;


     const deleteButton =
  item.querySelector(".danger");

deleteButton.addEventListener(
  "click",
  () => deleteProduct(product.id)
);


const editButton =
  item.querySelector(".edit");

editButton.addEventListener(
  "click",
  () => editProduct(product.id)
);


      productsContainer.appendChild(item);

    });

  }


  /* =========================================================
     KATEGORIE LÖSCHEN
     ========================================================= */

  async function deleteCategory(categoryId) {

    const confirmed =
      confirm(
        "Möchtest du diese Kategorie wirklich löschen?"
      );


    if (!confirmed) return;


    const {
      error
    } =
      await supabaseClient
        .from("customer_categories")
        .delete()
        .eq("id", categoryId);


    if (error) {

      console.error(error);

      showMessage(
        "Kategorie konnte nicht gelöscht werden.",
        "error"
      );

      return;

    }


    showMessage(
      "Kategorie wurde gelöscht.",
      "success"
    );


    await loadCategories();

  }

async function editProduct(productId) {

  const {
    data: product,
    error: loadError
  } =
    await supabaseClient
      .from("customer_products")
      .select("*")
      .eq("id", productId)
      .single();


  if (loadError || !product) {

    console.error(loadError);

    showMessage(
      "Produkt konnte nicht geladen werden.",
      "error"
    );

    return;

  }
if (product.image_url) {

  alert(
    "Aktuelles Produktbild vorhanden:\n\n" +
    product.image_url
  );

}

  const title =
    prompt(
      "Produktname:",
      product.title || ""
    );

  if (title === null) return;


  const description =
    prompt(
      "Beschreibung:",
      product.description || ""
    );

  if (description === null) return;


  const price =
    prompt(
      "Preis:",
      product.price !== null
        ? product.price
        : ""
    );

  if (price === null) return;


  const affiliateUrl =
    prompt(
      "Affiliate-URL:",
      product.affiliate_url || ""
    );

  if (affiliateUrl === null) return;
let newImageUrl =
  product.image_url || null;
let oldImagePath = null;

if (product.image_url) {

  const marker =
    "/storage/v1/object/public/product-images/";

  const markerIndex =
    product.image_url.indexOf(marker);

  if (markerIndex !== -1) {

    oldImagePath =
      product.image_url.substring(
        markerIndex + marker.length
      );

  }

}

const replaceImage =
  confirm(
    "Möchtest du das Produktbild ändern?"
  );


if (replaceImage) {

  const imageInput =
    document.createElement("input");

  imageInput.type = "file";
  imageInput.accept =
    "image/jpeg,image/png,image/webp";

  imageInput.click();


  await new Promise(resolve => {

    imageInput.addEventListener(
      "change",
      resolve,
      { once: true }
    );

  });


  const imageFile =
    imageInput.files[0];


  if (imageFile) {

    const fileExtension =
      imageFile.name
        .split(".")
        .pop()
        .toLowerCase();


    const filePath =
      currentUser.id +
      "/" +
      crypto.randomUUID() +
      "." +
      fileExtension;


    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("product-images")
        .upload(
          filePath,
          imageFile,
          {
            contentType:
              imageFile.type,
            upsert: false
          }
        );


    if (uploadError) {

      console.error(
        "Bild Upload Fehler:",
        uploadError
      );

      showMessage(
        "Produktbild konnte nicht hochgeladen werden.",
        "error"
      );

      return;

    }


    const {
      data: publicUrlData
    } =
      supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(filePath);


newImageUrl =
      publicUrlData.publicUrl;

    if (oldImagePath) {

      const {
        error: deleteError
      } =
        await supabaseClient
          .storage
          .from("product-images")
          .remove([
            oldImagePath
          ]);

      if (deleteError) {

        console.error(
          "Altes Produktbild konnte nicht gelöscht werden:",
          deleteError
        );

      }

    }

  }

}

  const {
    error
  } =
    await supabaseClient
      .from("customer_products")
      .update({
        title: title.trim(),
        description:
          description.trim()
            ? description.trim()
            : null,
        price:
          price.trim()
            ? Number(price.replace(",", "."))
            : null,
        affiliate_url:
          affiliateUrl.trim(),
        image_url:
  newImageUrl
      })
      .eq("id", productId);


  if (error) {

    console.error(error);

    showMessage(
      "Produkt konnte nicht bearbeitet werden.",
      "error"
    );

    return;

  }


  showMessage(
    "Produkt wurde aktualisiert.",
    "success"
  );


  await loadProducts();

}
  /* =========================================================
     PRODUKT LÖSCHEN
     ========================================================= */

  async function deleteProduct(productId) {

    const confirmed =
      confirm(
        "Möchtest du dieses Produkt wirklich löschen?"
      );


    if (!confirmed) return;


    const {
      error
    } =
      await supabaseClient
        .from("customer_products")
        .delete()
        .eq("id", productId);


    if (error) {

      console.error(error);

      showMessage(
        "Produkt konnte nicht gelöscht werden.",
        "error"
      );

      return;

    }


    showMessage(
      "Produkt wurde gelöscht.",
      "success"
    );


    await loadProducts();

  }


  /* =========================================================
     KATEGORIE HINZUFÜGEN
     ========================================================= */
document
  .getElementById("add-product-button")
  .addEventListener(
    "click",
    async () => {
clearMessage();
      const form =
        document.getElementById(
          "product-form"
        );

      form.style.display =
        "block";


      productCategoryInput.innerHTML =
        '<option value="">Kategorien werden geladen...</option>';


      const {
        data: categories,
        error
      } =
        await supabaseClient
          .from("customer_categories")
          .select("id,name")
          .order("created_at", {
            ascending: true
          });


      if (error) {

        console.error(error);

        productCategoryInput.innerHTML =
          '<option value="">Kategorien konnten nicht geladen werden</option>';

        return;

      }


      if (!categories.length) {

        productCategoryInput.innerHTML =
          '<option value="">Keine Kategorien vorhanden</option>';

        return;

      }


      productCategoryInput.innerHTML =
        '<option value="">Kategorie auswählen</option>';


      categories.forEach(category => {

        const option =
          document.createElement("option");

        option.value =
          category.id;

        option.textContent =
          category.name;

        productCategoryInput.appendChild(
          option
        );

      });


      window.scrollTo({
        top: form.offsetTop,
        behavior: "smooth"
      });

    }
  );
  document
    .getElementById("add-category-button")
    .addEventListener(
      "click",
      async () => {

        const name =
          prompt(
            "Name der neuen Kategorie:"
          );


        if (!name) return;


        const cleanName =
          name.trim();


        if (!cleanName) return;


        const slug =
          cleanName
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");


        const {
          error
        } =
          await supabaseClient
            .from("customer_categories")
            .insert({
              customer_id: currentUser.id,
              name: cleanName,
              slug: slug,
              icon: "📂",
              active: true
            });


        if (error) {

          console.error(error);

          showMessage(
            "Kategorie konnte nicht erstellt werden.",
            "error"
          );

          return;

        }


        showMessage(
          "Kategorie wurde erstellt.",
          "success"
        );


        await loadCategories();

      }
    );


  /* =========================================================
     PRODUKT HINZUFÜGEN
     ========================================================= */




  /* =========================================================
     ABMELDEN
     ========================================================= */

  document
    .getElementById("logout-button")
    .addEventListener(
      "click",
      async () => {

        const {
          error
        } =
          await supabaseClient.auth.signOut();


        if (error) {

          console.error(error);

          showMessage(
            "Abmelden fehlgeschlagen.",
            "error"
          );

          return;

        }


        window.location.href =
          "login.html";

      }
    );


  /* =========================================================
     START
     ========================================================= */

  checkSession();

</script>
