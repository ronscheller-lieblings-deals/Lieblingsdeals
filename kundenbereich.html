<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>LieblingsDeals – Kundenbereich</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
      padding-bottom: 40px;
    }

    header {
      background: #ff6a00;
      color: #fff;
      padding: 22px 20px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px #0001;
    }

    h2 {
      margin-bottom: 15px;
    }

    h3 {
      margin-bottom: 8px;
    }

    .account-info {
      color: #666;
      line-height: 1.6;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #ff6a00;
      color: #fff;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .danger {
      background: #ffe5e5;
      color: #a00000;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .category-list,
    .product-list {
      display: grid;
      gap: 12px;
    }

    .item {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 15px;
      background: #fafafa;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .item-title {
      font-weight: 700;
      font-size: 17px;
    }

    .muted {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .empty {
      padding: 20px;
      text-align: center;
      color: #777;
      background: #fafafa;
      border-radius: 12px;
    }

    .loading {
      color: #777;
      padding: 10px 0;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    .success {
      background: #e8f7e8;
      color: #176b17;
    }

    .error {
      background: #ffe8e8;
      color: #a00000;
    }

    .logout {
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 0 15px;
      }

      .top-actions {
        align-items: stretch;
      }

      .top-actions button {
        width: 100%;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <div class="logo">⭐ LieblingsDeals</div>
  <div class="subtitle">Dein persönlicher Kundenbereich</div>
</header>


<div class="container">

  <div id="message" class="message"></div>


  <!-- =====================================================
       KONTO
       ===================================================== -->

  <div class="card">

    <div class="top-actions">

      <div>
        <h2>👤 Mein Konto</h2>

        <div
          id="account-info"
          class="account-info"
        >
          Konto wird geladen...
        </div>
      </div>

      <button
        id="logout-button"
        class="danger"
      >
        🚪 Abmelden
      </button>

    </div>

  </div>


  <!-- =====================================================
       KATEGORIEN
       ===================================================== -->

  <div class="card">

    <div class="top-actions">

      <h2>📂 Meine Kategorien</h2>

      <button
        id="add-category-button"
        class="primary"
      >
        ➕ Kategorie
      </button>

    </div>

    <div
      id="categories"
      class="category-list"
    >
      <div class="loading">
        Kategorien werden geladen...
      </div>
    </div>

  </div>


  <!-- =====================================================
       PRODUKTE
       ===================================================== -->

  <div class="card">

    <div class="top-actions">

      <h2>🛍️ Meine Produkte</h2>

      <button
        id="add-product-button"
        class="primary"
      >
        ➕ Produkt
      </button>

    </div>

    <div
      id="products"
      class="product-list"
    >
      <div class="loading">
        Produkte werden geladen...
      </div>
    </div>

  </div>

</div>


<script>

  /* =========================================================
     SUPABASE
     ========================================================= */

  const SUPABASE_URL =
    "https://cklnfznlzyushvlybzad.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_FQB7IjlWRpGhNf4r1pV5Vg_JHQgxkGg";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     ELEMENTE
     ========================================================= */

  const message =
    document.getElementById("message");

  const accountInfo =
    document.getElementById("account-info");

  const categoriesContainer =
    document.getElementById("categories");

  const productsContainer =
    document.getElementById("products");


  let currentUser = null;


  /* =========================================================
     NACHRICHT
     ========================================================= */

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";

  }


  function clearMessage() {

    message.textContent = "";

    message.style.display = "none";

  }


  /* =========================================================
     SESSION PRÜFEN
     ========================================================= */

  async function checkSession() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(error);

      showMessage(
        "Die Sitzung konnte nicht geladen werden.",
        "error"
      );

      return;

    }


    if (!data.session) {

      window.location.href =
        "login.html";

      return;

    }


    currentUser =
      data.session.user;


    accountInfo.innerHTML = `
      <strong>E-Mail:</strong>
      ${escapeHtml(currentUser.email || "")}
      <br>
      <strong>User-ID:</strong>
      ${escapeHtml(currentUser.id)}
    `;


    await loadCategories();

    await loadProducts();

  }


  /* =========================================================
     HTML SICHER DARSTELLEN
     ========================================================= */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =========================================================
     KATEGORIEN LADEN
     ========================================================= */

  async function loadCategories() {

    categoriesContainer.innerHTML =
      '<div class="loading">Kategorien werden geladen...</div>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from("customer_categories")
        .select("*")
        .order("created_at", {
          ascending: true
        });


    if (error) {

      console.error(error);

      categoriesContainer.innerHTML =
        '<div class="empty">Kategorien konnten nicht geladen werden.</div>';

      return;

    }


    if (!data.length) {

      categoriesContainer.innerHTML =
        '<div class="empty">Du hast noch keine eigenen Kategorien.</div>';

      return;

    }


    categoriesContainer.innerHTML = "";


    data.forEach(category => {

      const item =
        document.createElement("div");

      item.className = "item";

      item.innerHTML = `

        <div class="item-header">

          <div>

            <div class="item-title">
              ${escapeHtml(category.icon || "")}
              ${escapeHtml(category.name)}
            </div>

            <div class="muted">
              Slug:
              ${escapeHtml(category.slug)}
            </div>

          </div>

          <button
            class="danger"
            data-id="${escapeHtml(category.id)}"
          >
            Löschen
          </button>

        </div>

      `;


      item
        .querySelector("button")
        .addEventListener(
          "click",
          () => deleteCategory(category.id)
        );


      categoriesContainer.appendChild(item);

    });

  }


  /* =========================================================
     PRODUKTE LADEN
     ========================================================= */

  async function loadProducts() {

    productsContainer.innerHTML =
      '<div class="loading">Produkte werden geladen...</div>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from("customer_products")
        .select("*")
        .order("sort_order", {
          ascending: true
        });


    if (error) {

      console.error(error);

      productsContainer.innerHTML =
        '<div class="empty">Produkte konnten nicht geladen werden.</div>';

      return;

    }


    if (!data.length) {

      productsContainer.innerHTML =
        '<div class="empty">Du hast noch keine eigenen Produkte.</div>';

      return;

    }


    productsContainer.innerHTML = "";


    data.forEach(product => {

      const item =
        document.createElement("div");

      item.className = "item";

      item.innerHTML = `

        <div class="item-header">

          <div>

            <div class="item-title">
              ${escapeHtml(product.title)}
            </div>

            <div class="muted">
              ${escapeHtml(product.description || "")}
            </div>

            ${
              product.price !== null
                ? `
                  <div class="muted">
                    Preis:
                    ${escapeHtml(product.price)} €
                  </div>
                `
                : ""
            }

          </div>

          <button
            class="danger"
            data-id="${escapeHtml(product.id)}"
          >
            Löschen
          </button>

        </div>

      `;


      item
        .querySelector("button")
        .addEventListener(
          "click",
          () => deleteProduct(product.id)
        );


      productsContainer.appendChild(item);

    });

  }


  /* =========================================================
     KATEGORIE LÖSCHEN
     ========================================================= */

  async function deleteCategory(categoryId) {

    const confirmed =
      confirm(
        "Möchtest du diese Kategorie wirklich löschen?"
      );


    if (!confirmed) return;


    const {
      error
    } =
      await supabaseClient
        .from("customer_categories")
        .delete()
        .eq("id", categoryId);


    if (error) {

      console.error(error);

      showMessage(
        "Kategorie konnte nicht gelöscht werden.",
        "error"
      );

      return;

    }


    showMessage(
      "Kategorie wurde gelöscht.",
      "success"
    );


    await loadCategories();

  }


  /* =========================================================
     PRODUKT LÖSCHEN
     ========================================================= */

  async function deleteProduct(productId) {

    const confirmed =
      confirm(
        "Möchtest du dieses Produkt wirklich löschen?"
      );


    if (!confirmed) return;


    const {
      error
    } =
      await supabaseClient
        .from("customer_products")
        .delete()
        .eq("id", productId);


    if (error) {

      console.error(error);

      showMessage(
        "Produkt konnte nicht gelöscht werden.",
        "error"
      );

      return;

    }


    showMessage(
      "Produkt wurde gelöscht.",
      "success"
    );


    await loadProducts();

  }


  /* =========================================================
     KATEGORIE HINZUFÜGEN
     ========================================================= */

  document
    .getElementById("add-category-button")
    .addEventListener(
      "click",
      async () => {

        const name =
          prompt(
            "Name der neuen Kategorie:"
          );


        if (!name) return;


        const cleanName =
          name.trim();


        if (!cleanName) return;


        const slug =
          cleanName
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "");


        const {
          error
        } =
          await supabaseClient
            .from("customer_categories")
            .insert({
              customer_id: currentUser.id,
              name: cleanName,
              slug: slug,
              icon: "📂",
              active: true
            });


        if (error) {

          console.error(error);

          showMessage(
            "Kategorie konnte nicht erstellt werden.",
            "error"
          );

          return;

        }


        showMessage(
          "Kategorie wurde erstellt.",
          "success"
        );


        await loadCategories();

      }
    );


  /* =========================================================
     PRODUKT HINZUFÜGEN
     ========================================================= */

  document
    .getElementById("add-product-button")
    .addEventListener(
      "click",
      async () => {

        const title =
          prompt(
            "Name des Produkts:"
          );


        if (!title) return;


        const description =
          prompt(
            "Beschreibung des Produkts:"
          );


        const affiliateUrl =
          prompt(
            "Affiliate-URL des Produkts:"
          );


        if (!affiliateUrl) {

          showMessage(
            "Eine Affiliate-URL ist erforderlich.",
            "error"
          );

          return;

        }


        /* Zunächst vorhandene Kategorien laden */

        const {
          data: customerCategories,
          error: categoryError
        } =
          await supabaseClient
            .from("customer_categories")
            .select("id,name")
            .order("created_at", {
              ascending: true
            });


        if (categoryError) {

          console.error(categoryError);

          showMessage(
            "Kategorien konnten nicht geladen werden.",
            "error"
          );

          return;

        }


        if (!customerCategories.length) {

          showMessage(
            "Bitte erst eine eigene Kategorie erstellen.",
            "error"
          );

          return;

        }


const categoryText =
  customerCategories
    .map(
      (category, index) =>
        (index + 1) +
        " = " +
        category.name
    )
    .join("\n");


const selectedNumber =
  prompt(
    "Kategorie auswählen:\n\n" +
    categoryText +
    "\n\nBitte die Nummer eingeben:"
  );


if (!selectedNumber) return;


const categoryIndex =
  Number(selectedNumber.trim()) - 1;


if (
  !Number.isInteger(categoryIndex) ||
  categoryIndex < 0 ||
  categoryIndex >= customerCategories.length
) {

  showMessage(
    "Ungültige Kategorie.",
    "error"
  );

  return;

}


const selectedCategory =
  customerCategories[categoryIndex];


        const {
          error
        } =
          await supabaseClient
            .from("customer_products")
            .insert({
              customer_id: currentUser.id,
              category_id: selectedCategory.trim(),
              title: title.trim(),
              description:
                description
                  ? description.trim()
                  : null,
              price: null,
              image_url: null,
              affiliate_url:
                affiliateUrl.trim(),
              sort_order: 0,
              active: true
            });


        if (error) {

          console.error(error);

          showMessage(
            "Produkt konnte nicht erstellt werden.",
            "error"
          );

          return;

        }


        showMessage(
          "Produkt wurde erstellt.",
          "success"
        );


        await loadProducts();

      }
    );


  /* =========================================================
     ABMELDEN
     ========================================================= */

  document
    .getElementById("logout-button")
    .addEventListener(
      "click",
      async () => {

        const {
          error
        } =
          await supabaseClient.auth.signOut();


        if (error) {

          console.error(error);

          showMessage(
            "Abmelden fehlgeschlagen.",
            "error"
          );

          return;

        }


        window.location.href =
          "login.html";

      }
    );


  /* =========================================================
     START
     ========================================================= */

  checkSession();

</script>

</body>
</html>
