<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>LieblingsDeals – Kundenbereich</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
      padding-bottom: 40px;
    }

    header {
      background: #ff6a00;
      color: #fff;
      padding: 22px 20px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px #0001;
    }

    h2 {
      margin-bottom: 15px;
    }

    h3 {
      margin-bottom: 8px;
    }

    .account-info {
      color: #666;
      line-height: 1.6;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #ff6a00;
      color: #fff;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .danger {
      background: #ffe5e5;
      color: #a00000;
    }

    .edit {
      background: #fff0e6;
      color: #ff6a00;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .category-list,
    .product-list {
      display: grid;
      gap: 12px;
    }

    .item {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 15px;
      background: #fafafa;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .item-title {
      font-weight: 700;
      font-size: 17px;
    }

    .muted {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .empty {
      padding: 20px;
      text-align: center;
      color: #777;
      background: #fafafa;
      border-radius: 12px;
    }

    .loading {
      color: #777;
      padding: 10px 0;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    .success {
      background: #e8f7e8;
      color: #176b17;
    }

    .error {
      background: #ffe8e8;
      color: #a00000;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      margin-top: 6px;
      background: #fff;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      font-weight: 700;
      font-size: 14px;
    }

    .form-row {
      margin-bottom: 14px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .product-image-preview {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      margin-top: 8px;
      border: 1px solid #eee;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 0 15px;
      }

      .top-actions {
        align-items: stretch;
      }

      .top-actions > * {
        width: 100%;
      }

      .product-actions button {
        width: 100%;
      }

      .form-actions button {
        width: 100%;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <div class="logo">⭐ LieblingsDeals</div>
  <div class="subtitle">Dein persönlicher Kundenbereich</div>
</header>

<div class="container">

  <div id="message" class="message"></div>

  <!-- =====================================================
       KONTO
       ===================================================== -->

  <div class="card">

    <div class="top-actions">

      <div>
        <h2>👤 Mein Konto</h2>

        <div id="account-info" class="account-info">
          Konto wird geladen...
        </div>
      </div>

      <button
        id="logout-button"
        class="danger"
        type="button"
      >
        🚪 Abmelden
      </button>

    </div>

  </div>


  <!-- =====================================================
       KATEGORIEN
       ===================================================== -->

  <div class="card">

    <div class="top-actions">

      <h2>📂 Meine Kategorien</h2>

      <button
        id="add-category-button"
        class="primary"
        type="button"
      >
        ➕ Kategorie
      </button>

    </div>

    <div
      id="categories"
      class="category-list"
    >
      <div class="loading">
        Kategorien werden geladen...
      </div>
    </div>

  </div>


  <!-- =====================================================
       PRODUKTE
       ===================================================== -->

  <div class="card">

    <div class="top-actions">

      <h2>🛍️ Meine Produkte</h2>

      <button
        id="add-product-button"
        class="primary"
        type="button"
      >
        ➕ Produkt
      </button>

    </div>

    <div
      id="products"
      class="product-list"
    >
      <div class="loading">
        Produkte werden geladen...
      </div>
    </div>


    <!-- =====================================================
         PRODUKT-FORMULAR
         ===================================================== -->

    <div
      id="product-form"
      style="display:none; margin-top:20px;"
    >

      <h3 id="product-form-title">
        Produkt erstellen
      </h3>

      <div class="form-row">
        <label for="product-title-input">
          Produktname
        </label>

        <input
          type="text"
          id="product-title-input"
          placeholder="Produktname"
        >
      </div>


      <div class="form-row">
        <label for="product-image-input">
          Produktbild
        </label>

        <input
          type="file"
          id="product-image-input"
          accept="image/jpeg,image/png,image/webp"
        >

        <div id="current-image-container"></div>
      </div>


      <div class="form-row">
        <label for="product-description-input">
          Beschreibung
        </label>

        <textarea
          id="product-description-input"
          placeholder="Beschreibung des Produkts"
        ></textarea>
      </div>


      <div class="form-row">
        <label for="product-price-input">
          Preis
        </label>

        <input
          type="text"
          id="product-price-input"
          placeholder="z. B. 19,99"
        >
      </div>


      <div class="form-row">
        <label for="product-affiliate-input">
          Affiliate-URL
        </label>

        <input
          type="url"
          id="product-affiliate-input"
          placeholder="https://..."
        >
      </div>


      <div class="form-row">
        <label for="product-category-input">
          Kategorie
        </label>

        <select id="product-category-input">
          <option value="">
            Kategorie auswählen
          </option>
        </select>
      </div>


      <div class="form-actions">

        <button
          type="button"
          id="save-product-button"
          class="primary"
        >
          Produkt speichern
        </button>

        <button
          type="button"
          id="cancel-product-button"
          class="secondary"
        >
          Abbrechen
        </button>

      </div>

    </div>

  </div>

</div>


<script>

  /* =========================================================
     SUPABASE
     ========================================================= */

  const SUPABASE_URL =
    "https://cklnfznlzyushvlybzad.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_FQB7IjlWRpGhNf4r1pV5Vg_JHQgxkGg";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     ELEMENTE
     ========================================================= */

  const message =
    document.getElementById("message");

  const accountInfo =
    document.getElementById("account-info");

  const categoriesContainer =
    document.getElementById("categories");

  const productsContainer =
    document.getElementById("products");

  const productForm =
    document.getElementById("product-form");

  const productFormTitle =
    document.getElementById("product-form-title");

  const productTitleInput =
    document.getElementById("product-title-input");

  const productImageInput =
    document.getElementById("product-image-input");

  const productDescriptionInput =
    document.getElementById("product-description-input");

  const productPriceInput =
    document.getElementById("product-price-input");

  const productAffiliateInput =
    document.getElementById("product-affiliate-input");

  const productCategoryInput =
    document.getElementById("product-category-input");

  const currentImageContainer =
    document.getElementById("current-image-container");

  const saveProductButton =
    document.getElementById("save-product-button");

  const cancelProductButton =
    document.getElementById("cancel-product-button");


  /* =========================================================
     VARIABLEN
     ========================================================= */

  let currentUser = null;

  let editingProductId = null;

  let editingProductOldImagePath = null;


  /* =========================================================
     NACHRICHTEN
     ========================================================= */

  function showMessage(text, type) {

    message.textContent =
      text;

    message.className =
      "message " + type;

    message.style.display =
      "block";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  function clearMessage() {

    message.textContent =
      "";

    message.className =
      "message";

    message.style.display =
      "none";

  }


  /* =========================================================
     HTML SICHER DARSTELLEN
     ========================================================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =========================================================
     SESSION
     ========================================================= */

  async function checkSession() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if (error) {

      console.error(
        "Session Fehler:",
        error
      );

      showMessage(
        "Die Sitzung konnte nicht geladen werden.",
        "error"
      );

      return;

    }


    if (!data.session) {

      window.location.href =
        "login.html";

      return;

    }


    currentUser =
      data.session.user;


    accountInfo.innerHTML = `
      <strong>E-Mail:</strong>
      ${escapeHtml(currentUser.email || "")}
      <br>
      <strong>User-ID:</strong>
      ${escapeHtml(currentUser.id)}
    `;


    await loadCategories();

    await loadProducts();

  }


  /* =========================================================
     KATEGORIEN LADEN
     ========================================================= */

  async function loadCategories() {

    categoriesContainer.innerHTML =
      '<div class="loading">Kategorien werden geladen...</div>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from("customer_categories")
        .select(
          "id,customer_id,name,slug,icon,active,created_at"
        )
        .eq(
          "customer_id",
          currentUser.id
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "Kategorien Fehler:",
        error
      );

      categoriesContainer.innerHTML =
        '<div class="empty">Kategorien konnten nicht geladen werden.</div>';

      return;

    }


    const categories =
      data || [];


    if (!categories.length) {

      categoriesContainer.innerHTML =
        '<div class="empty">Du hast noch keine eigenen Kategorien.</div>';

      productCategoryInput.innerHTML =
        '<option value="">Keine Kategorien vorhanden</option>';

      return;

    }


    categoriesContainer.innerHTML =
      "";

    productCategoryInput.innerHTML =
      '<option value="">Kategorie auswählen</option>';


    categories.forEach(
      function(category) {

        const item =
          document.createElement("div");

        item.className =
          "item";

        item.innerHTML = `

          <div class="item-header">

            <div>

              <div class="item-title">

                ${escapeHtml(
                  category.icon || "📂"
                )}

                ${escapeHtml(
                  category.name
                )}

              </div>

              <div class="muted">

                Slug:
                ${escapeHtml(
                  category.slug || ""
                )}

              </div>

            </div>

            <button
              class="danger"
              type="button"
            >
              Löschen
            </button>

          </div>

        `;


        item
          .querySelector("button")
          .addEventListener(
            "click",
            function() {

              deleteCategory(
                category.id
              );

            }
          );


        categoriesContainer.appendChild(
          item
        );


        const option =
          document.createElement("option");

        option.value =
          category.id;

        option.textContent =
          (
            category.icon || "📂"
          ) +
          " " +
          category.name;

        productCategoryInput.appendChild(
          option
        );

      }
    );

  }


  /* =========================================================
     KATEGORIE ERSTELLEN
     ========================================================= */

  document
    .getElementById("add-category-button")
    .addEventListener(
      "click",
      async function() {

        clearMessage();


        const name =
          prompt(
            "Name der neuen Kategorie:"
          );


        if (name === null) {
          return;
        }


        const cleanName =
          name.trim();


        if (!cleanName) {

          showMessage(
            "Bitte einen Kategorienamen eingeben.",
            "error"
          );

          return;

        }


        const slug =
          cleanName
            .toLowerCase()
            .normalize("NFD")
            .replace(
              /[\u0300-\u036f]/g,
              ""
            )
            .replace(
              /[^a-z0-9]+/g,
              "-"
            )
            .replace(
              /^-+|-+$/g,
              ""
            );


        if (!slug) {

          showMessage(
            "Aus dem Kategorienamen konnte kein gültiger Slug erstellt werden.",
            "error"
          );

          return;

        }


        const {
          error
        } =
        await supabaseClient
          .from("customer_categories")
          .insert({
            customer_id:
              currentUser.id,

            name:
              cleanName,

            slug:
              slug,

            icon:
              "📂",

            active:
              true
          });


        if (error) {

          console.error(
            "Kategorie INSERT Fehler:",
            error
          );

          showMessage(
            "Kategorie konnte nicht erstellt werden: " +
            error.message,
            "error"
          );

          return;

        }


        showMessage(
          "Kategorie wurde erstellt.",
          "success"
        );


        await loadCategories();

      }
    );


  /* =========================================================
     KATEGORIE LÖSCHEN
     ========================================================= */

  async function deleteCategory(
    categoryId
  ) {

    const confirmed =
      confirm(
        "Möchtest du diese Kategorie wirklich löschen?"
      );


    if (!confirmed) {
      return;
    }


    const {
      data: products,
      error: productCheckError
    } =
      await supabaseClient
        .from("customer_products")
        .select("id")
        .eq(
          "category_id",
          categoryId
        )
        .eq(
          "customer_id",
          currentUser.id
        );


    if (productCheckError) {

      console.error(
        productCheckError
      );

      showMessage(
        "Kategorie konnte nicht geprüft werden.",
        "error"
      );

      return;

    }


    if (
      products &&
      products.length
    ) {

      showMessage(
        "Diese Kategorie enthält noch Produkte. Bitte lösche oder verschiebe die Produkte zuerst.",
        "error"
      );

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("customer_categories")
        .delete()
        .eq(
          "id",
          categoryId
        )
        .eq(
          "customer_id",
          currentUser.id
        );


    if (error) {

      console.error(
        "Kategorie DELETE Fehler:",
        error
      );

      showMessage(
        "Kategorie konnte nicht gelöscht werden: " +
        error.message,
        "error"
      );

      return;

    }


    showMessage(
      "Kategorie wurde gelöscht.",
      "success"
    );


    await loadCategories();

  }


  /* =========================================================
     PRODUKTE LADEN
     ========================================================= */

  async function loadProducts() {

    productsContainer.innerHTML =
      '<div class="loading">Produkte werden geladen...</div>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from("customer_products")
        .select(
          "id,customer_id,category_id,title,description,price,image_url,affiliate_url,sort_order,active,created_at"
        )
        .eq(
          "customer_id",
          currentUser.id
        )
        .order(
          "sort_order",
          {
            ascending: true
          }
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (error) {

      console.error(
        "Produkte Fehler:",
        error
      );

      productsContainer.innerHTML =
        '<div class="empty">Produkte konnten nicht geladen werden.</div>';

      return;

    }


    const products =
      data || [];


    if (!products.length) {

      productsContainer.innerHTML =
        '<div class="empty">Du hast noch keine eigenen Produkte.</div>';

      return;

    }


    productsContainer.innerHTML =
      "";


    products.forEach(
      function(product) {

        const item =
          document.createElement("div");

        item.className =
          "item";


        const imageHtml =
          product.image_url
            ? `
              <img
                src="${escapeHtml(product.image_url)}"
                alt="${escapeHtml(product.title)}"
                class="product-image-preview"
              >
            `
            : "";


        const priceHtml =
          product.price !== null &&
          product.price !== undefined
            ? `
              <div class="muted">
                Preis:
                ${escapeHtml(
                  String(product.price)
                )} €
              </div>
            `
            : "";


        item.innerHTML = `

          <div>

            ${imageHtml}

            <div class="item-title">
              ${escapeHtml(
                product.title
              )}
            </div>

            ${
              product.description
                ? `
                  <div class="muted">
                    ${escapeHtml(
                      product.description
                    )}
                  </div>
                `
                : ""
            }

            ${priceHtml}

            ${
              product.affiliate_url
                ? `
                  <div class="muted">
                    Affiliate-URL vorhanden
                  </div>
                `
                : ""
            }

          </div>


          <div class="product-actions">

            <button
              type="button"
              class="edit"
            >
              ✏️ Bearbeiten
            </button>

            <button
              type="button"
              class="danger"
            >
              🗑️ Löschen
            </button>

          </div>

        `;


        const buttons =
          item.querySelectorAll("button");


        buttons[0].addEventListener(
          "click",
          function() {

            editProduct(
              product.id
            );

          }
        );


        buttons[1].addEventListener(
          "click",
          function() {

            deleteProduct(
              product.id
            );

          }
        );


        productsContainer.appendChild(
          item
        );

      }
    );

  }


  /* =========================================================
     PRODUKT-FORMULAR ÖFFNEN
     ========================================================= */

  document
    .getElementById("add-product-button")
    .addEventListener(
      "click",
      async function() {

        clearMessage();

        await loadCategories();


        editingProductId =
          null;

        editingProductOldImagePath =
          null;


        productFormTitle.textContent =
          "Produkt erstellen";


        saveProductButton.textContent =
          "Produkt speichern";


        productTitleInput.value =
          "";

        productDescriptionInput.value =
          "";

        productPriceInput.value =
          "";

        productAffiliateInput.value =
          "";

        productImageInput.value =
          "";


        currentImageContainer.innerHTML =
          "";


        productCategoryInput.value =
          "";


        productForm.style.display =
          "block";


        productForm.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }
    );


  /* =========================================================
     PRODUKT SPEICHERN / AKTUALISIEREN
     ========================================================= */

  saveProductButton.addEventListener(
    "click",
    async function() {

      clearMessage();


      const title =
        productTitleInput.value.trim();

      const description =
        productDescriptionInput.value.trim();

      const priceText =
        productPriceInput.value.trim();

      const affiliateUrl =
        productAffiliateInput.value.trim();

      const categoryId =
        productCategoryInput.value;

      const imageFile =
        productImageInput.files[0];


      if (!title) {

        showMessage(
          "Bitte einen Produktnamen eingeben.",
          "error"
        );

        return;

      }


      if (!affiliateUrl) {

        showMessage(
          "Eine Affiliate-URL ist erforderlich.",
          "error"
        );

        return;

      }


      if (!categoryId) {

        showMessage(
          "Bitte eine Kategorie auswählen.",
          "error"
        );

        return;

      }


      let price =
        null;


      if (priceText) {

        const normalizedPrice =
          priceText
            .replace(",", ".")
            .replace(/[^\d.-]/g, "");


        price =
          Number(
            normalizedPrice
          );


        if (!Number.isFinite(price)) {

          showMessage(
            "Der Preis ist ungültig.",
            "error"
          );

          return;

        }

      }


      /* =====================================================
         NEUES PRODUKT
         ===================================================== */

      if (!editingProductId) {

        if (!imageFile) {

          showMessage(
            "Bitte ein Produktbild auswählen.",
            "error"
          );

          return;

        }


        const uploadResult =
          await uploadProductImage(
            imageFile
          );


        if (!uploadResult) {
          return;
        }


        const imageUrl =
          uploadResult.publicUrl;


        const {
          data,
          error
        } =
        await supabaseClient
          .from("customer_products")
          .insert({

            customer_id:
              currentUser.id,

            category_id:
              categoryId,

            title:
              title,

            description:
              description
                ? description
                : null,

            price:
              price,

            image_url:
              imageUrl,

            affiliate_url:
              affiliateUrl,

            sort_order:
              0,

            active:
              true

          })
          .select()
          .single();


        if (error) {

          console.error(
            "Produkt INSERT Fehler:",
            error
          );


          /* Falls Datenbank-Insert fehlschlägt,
             versuchen wir das gerade hochgeladene
             Bild wieder zu entfernen. */

          await removeStorageFile(
            uploadResult.filePath
          );


          showMessage(
            "Produkt konnte nicht erstellt werden: " +
            error.message,
            "error"
          );

          return;

        }


        console.log(
          "Produkt erfolgreich erstellt:",
          data
        );


        showMessage(
          "Produkt wurde erstellt.",
          "success"
        );


        closeProductForm();

        await loadProducts();

        return;

      }


      /* =====================================================
         BESTEHENDES PRODUKT AKTUALISIEREN
         ===================================================== */

      let newImageUrl =
        null;

      let uploadedNewImagePath =
        null;


      const {
        data: existingProduct,
        error: existingProductError
      } =
      await supabaseClient
        .from("customer_products")
        .select(
          "id,image_url"
        )
        .eq(
          "id",
          editingProductId
        )
        .eq(
          "customer_id",
          currentUser.id
        )
        .single();


      if (
        existingProductError ||
        !existingProduct
      ) {

        console.error(
          existingProductError
        );

        showMessage(
          "Das Produkt konnte nicht geladen werden.",
          "error"
        );

        return;

      }


      newImageUrl =
        existingProduct.image_url ||
        null;


      if (imageFile) {

        const uploadResult =
          await uploadProductImage(
            imageFile
          );


        if (!uploadResult) {
          return;
        }


        newImageUrl =
          uploadResult.publicUrl;

        uploadedNewImagePath =
          uploadResult.filePath;

      }


      const {
        error
      } =
      await supabaseClient
        .from("customer_products")
        .update({

          category_id:
            categoryId,

          title:
            title,

          description:
            description
              ? description
              : null,

          price:
            price,

          affiliate_url:
            affiliateUrl,

          image_url:
            newImageUrl

        })
        .eq(
          "id",
          editingProductId
        )
        .eq(
          "customer_id",
          currentUser.id
        );


      if (error) {

        console.error(
          "Produkt UPDATE Fehler:",
          error
        );


        if (uploadedNewImagePath) {

          await removeStorageFile(
            uploadedNewImagePath
          );

        }


        showMessage(
          "Produkt konnte nicht aktualisiert werden: " +
          error.message,
          "error"
        );

        return;

      }


      /* Altes Bild erst nach erfolgreichem
         Datenbank-Update löschen. */

      if (
        uploadedNewImagePath &&
        existingProduct.image_url
      ) {

        const oldPath =
          getStoragePathFromPublicUrl(
            existingProduct.image_url
          );


        if (oldPath) {

          await removeStorageFile(
            oldPath
          );

        }

      }


      showMessage(
        "Produkt wurde aktualisiert.",
        "success"
      );


      closeProductForm();

      await loadProducts();

    }
  );


  /* =========================================================
     BILD HOCHLADEN
     ========================================================= */

  async function uploadProductImage(
    imageFile
  ) {

    if (!imageFile) {
      return null;
    }


    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ];


    if (
      !allowedTypes.includes(
        imageFile.type
      )
    ) {

      showMessage(
        "Bitte nur JPG-, PNG- oder WebP-Bilder verwenden.",
        "error"
      );

      return null;

    }


    const maxSize =
      5 * 1024 * 1024;


    if (
      imageFile.size > maxSize
    ) {

      showMessage(
        "Das Produktbild darf maximal 5 MB groß sein.",
        "error"
      );

      return null;

    }


    const extension =
      imageFile.name
        .split(".")
        .pop()
        .toLowerCase();


    const filePath =
      currentUser.id +
      "/" +
      crypto.randomUUID() +
      "." +
      extension;


    const {
      error
    } =
    await supabaseClient
      .storage
      .from("product-images")
      .upload(
        filePath,
        imageFile,
        {
          contentType:
            imageFile.type,

          upsert:
            false
        }
      );


    if (error) {

      console.error(
        "Bild Upload Fehler:",
        error
      );

      showMessage(
        "Produktbild konnte nicht hochgeladen werden: " +
        error.message,
        "error"
      );

      return null;

    }


    const {
      data
    } =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(
        filePath
      );


    return {

      filePath:
        filePath,

      publicUrl:
        data.publicUrl

    };

  }


  /* =========================================================
     STORAGE DATEI LÖSCHEN
     ========================================================= */

  async function removeStorageFile(
    filePath
  ) {

    if (!filePath) {
      return;
    }


    const {
      error
    } =
    await supabaseClient
      .storage
      .from("product-images")
      .remove([
        filePath
      ]);


    if (error) {

      console.error(
        "Storage DELETE Fehler:",
        error
      );

    }

  }


  /* =========================================================
     STORAGE PFAD AUS PUBLIC URL ERMITTELN
     ========================================================= */

  function getStoragePathFromPublicUrl(
    imageUrl
  ) {

    if (!imageUrl) {
      return null;
    }


    const marker =
      "/storage/v1/object/public/product-images/";


    const index =
      imageUrl.indexOf(
        marker
      );


    if (index === -1) {
      return null;
    }


    return imageUrl.substring(
      index + marker.length
    );

  }


  /* =========================================================
     PRODUKT BEARBEITEN
     ========================================================= */

  async function editProduct(
    productId
  ) {

    clearMessage();


    const {
      data: product,
      error
    } =
    await supabaseClient
      .from("customer_products")
      .select("*")
      .eq(
        "id",
        productId
      )
      .eq(
        "customer_id",
        currentUser.id
      )
      .single();


    if (error || !product) {

      console.error(
        "Produkt laden Fehler:",
        error
      );

      showMessage(
        "Produkt konnte nicht geladen werden.",
        "error"
      );

      return;

    }


    await loadCategories();


    editingProductId =
      product.id;


    editingProductOldImagePath =
      getStoragePathFromPublicUrl(
        product.image_url
      );


    productFormTitle.textContent =
      "Produkt bearbeiten";


    saveProductButton.textContent =
      "Änderungen speichern";


    productTitleInput.value =
      product.title || "";


    productDescriptionInput.value =
      product.description || "";


    productPriceInput.value =
      product.price !== null &&
      product.price !== undefined
        ? String(product.price)
        : "";


    productAffiliateInput.value =
      product.affiliate_url || "";


    productCategoryInput.value =
      product.category_id || "";


    productImageInput.value =
      "";


    if (product.image_url) {

      currentImageContainer.innerHTML = `

        <div
          class="muted"
          style="margin-top:10px;"
        >
          Aktuelles Produktbild:
        </div>

        <img
          src="${escapeHtml(product.image_url)}"
          alt="${escapeHtml(product.title || "")}"
          class="product-image-preview"
        >

        <div
          class="muted"
        >
          Wenn du kein neues Bild auswählst,
          bleibt das aktuelle Bild erhalten.
        </div>

      `;

    } else {

      currentImageContainer.innerHTML =
        '<div class="muted">Noch kein Produktbild vorhanden.</div>';

    }


    productForm.style.display =
      "block";


    productForm.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }


  /* =========================================================
     PRODUKT-FORMULAR SCHLIESSEN
     ========================================================= */

  function closeProductForm() {

    editingProductId =
      null;

    editingProductOldImagePath =
      null;


    productFormTitle.textContent =
      "Produkt erstellen";


    saveProductButton.textContent =
      "Produkt speichern";


    productTitleInput.value =
      "";

    productDescriptionInput.value =
      "";

    productPriceInput.value =
      "";

    productAffiliateInput.value =
      "";

    productImageInput.value =
      "";

    productCategoryInput.value =
      "";

    currentImageContainer.innerHTML =
      "";


    productForm.style.display =
      "none";

  }


  cancelProductButton.addEventListener(
    "click",
    function() {

      closeProductForm();

    }
  );


  /* =========================================================
     PRODUKT LÖSCHEN
     ========================================================= */

  async function deleteProduct(
    productId
  ) {

    const confirmed =
      confirm(
        "Möchtest du dieses Produkt wirklich löschen?"
      );


    if (!confirmed) {
      return;
    }


    const {
      data: product,
      error: loadError
    } =
    await supabaseClient
      .from("customer_products")
      .select(
        "id,image_url"
      )
      .eq(
        "id",
        productId
      )
      .eq(
        "customer_id",
        currentUser.id
      )
      .single();


    if (
      loadError ||
      !product
    ) {

      console.error(
        "Produkt vor DELETE laden Fehler:",
        loadError
      );

      showMessage(
        "Produkt konnte nicht gefunden werden.",
        "error"
      );

      return;

    }


    const {
      error
    } =
    await supabaseClient
      .from("customer_products")
      .delete()
      .eq(
        "id",
        productId
      )
      .eq(
        "customer_id",
        currentUser.id
      );


    if (error) {

      console.error(
        "Produkt DELETE Fehler:",
        error
      );

      showMessage(
        "Produkt konnte nicht gelöscht werden: " +
        error.message,
        "error"
      );

      return;

    }


    if (product.image_url) {

      const imagePath =
        getStoragePathFromPublicUrl(
          product.image_url
        );


      if (imagePath) {

        await removeStorageFile(
          imagePath
        );

      }

    }


    showMessage(
      "Produkt wurde gelöscht.",
      "success"
    );


    await loadProducts();

  }


  /* =========================================================
     ABMELDEN
     ========================================================= */

  document
    .getElementById("logout-button")
    .addEventListener(
      "click",
      async function() {

        const {
          error
        } =
        await supabaseClient.auth.signOut();


        if (error) {

          console.error(
            "Logout Fehler:",
            error
          );

          showMessage(
            "Abmelden fehlgeschlagen.",
            "error"
          );

          return;

        }


        window.location.href =
          "login.html";

      }
    );


  /* =========================================================
     AUTH STATUS
     ========================================================= */

  supabaseClient.auth.onAuthStateChange(
    function(
      event,
      session
    ) {

      if (!session) {

        window.location.href =
          "login.html";

      }

    }
  );


  /* =========================================================
     START
     ========================================================= */

  checkSession();

</script>
